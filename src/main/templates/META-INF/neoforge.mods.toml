# Expanded into generated metadata during the build.

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[9.5.1,10)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="legendarysurvivaloverhaul"
    type="optional"
    versionRange="[2.3.24,)"
    ordering="AFTER"
    side="BOTH"
